<svg viewBox="0 0 500 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Poppins:wght@400;600;700&amp;display=swap');
      .title  { font-family:"Poppins",sans-serif; font-size:16px; font-weight:700; fill:#ff00ff; }
      .label  { font-family:"Poppins",sans-serif; font-size:12px; fill:#e0e0e0; }
      .value  { font-family:"JetBrains Mono",monospace; font-size:11px; fill:#00ffff; }
      .sublbl { font-family:"JetBrains Mono",monospace; font-size:9px; fill:#888; }
    </style>
    <linearGradient id="bgSt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   style="stop-color:#0a0014"/>
      <stop offset="100%" style="stop-color:#1a0033"/>
    </linearGradient>
    <linearGradient id="barPy"  x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#ff00ff"/><stop offset="100%" style="stop-color:#c400ff"/></linearGradient>
    <linearGradient id="barSql" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#00ffff"/><stop offset="100%" style="stop-color:#0080ff"/></linearGradient>
    <linearGradient id="barSf"  x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#00ffff"/><stop offset="100%" style="stop-color:#0080ff"/></linearGradient>
    <linearGradient id="barAws" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#ff9900"/><stop offset="100%" style="stop-color:#ffcc00"/></linearGradient>
    <linearGradient id="barEtl" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#ff00ff"/><stop offset="100%" style="stop-color:#ff0080"/></linearGradient>
    <filter id="glowSt">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Rank ring stroke-dasharray trick -->
    <!-- circumference of r=44 circle = 276.46 -->
  </defs>

  <!-- BG -->
  <rect width="500" height="320" rx="14" fill="url(#bgSt)" stroke="rgba(255,0,255,0.35)" stroke-width="1.5"/>
  <!-- inner shimmer line -->
  <rect x="1" y="1" width="498" height="318" rx="14" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Title -->
  <text x="24" y="38" class="title">⚡ Data Engineering Stats</text>

  <!-- Rank ring (decorative, right side) -->
  <g transform="translate(420,90)">
    <!-- track -->
    <circle cx="0" cy="0" r="44" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="8"/>
    <!-- fill - animated -->
    <circle cx="0" cy="0" r="44" fill="none" stroke="url(#barPy)" stroke-width="8"
            stroke-dasharray="0 276.46" stroke-linecap="round"
            transform="rotate(-90)">
      <animate attributeName="stroke-dasharray" from="0 276.46" to="220 276.46" dur="1.8s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </circle>
    <!-- glow duplicate -->
    <circle cx="0" cy="0" r="44" fill="none" stroke="rgba(255,0,255,0.3)" stroke-width="12"
            stroke-dasharray="0 276.46" transform="rotate(-90)" filter="url(#glowSt)">
      <animate attributeName="stroke-dasharray" from="0 276.46" to="220 276.46" dur="1.8s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </circle>
    <text x="0" y="-6" text-anchor="middle" style="font-family:'Poppins',sans-serif;font-size:11px;font-weight:700;fill:#ff00ff;">DE</text>
    <text x="0" y="10" text-anchor="middle" style="font-family:'JetBrains Mono',monospace;font-size:9px;fill:#888;">EXPERT</text>
  </g>

  <!-- Stat rows -->
  <!-- Row helper: label | track | animated bar | value -->

  <!-- Python -->
  <text x="24" y="78" class="label">Python</text>
  <rect x="130" y="65" width="250" height="10" rx="5" fill="rgba(255,255,255,0.06)"/>
  <rect x="130" y="65" width="0" height="10" rx="5" fill="url(#barPy)">
    <animate attributeName="width" from="0" to="225" dur="1.2s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <text x="390" y="77" class="value">Primary</text>

  <!-- SQL -->
  <text x="24" y="113" class="label">SQL</text>
  <rect x="130" y="100" width="250" height="10" rx="5" fill="rgba(255,255,255,0.06)"/>
  <rect x="130" y="100" width="0" height="10" rx="5" fill="url(#barSql)">
    <animate attributeName="width" from="0" to="210" dur="1.2s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <text x="390" y="112" class="value">Primary</text>

  <!-- Snowflake -->
  <text x="24" y="148" class="label">Snowflake</text>
  <rect x="130" y="135" width="250" height="10" rx="5" fill="rgba(255,255,255,0.06)"/>
  <rect x="130" y="135" width="0" height="10" rx="5" fill="url(#barSf)">
    <animate attributeName="width" from="0" to="200" dur="1.2s" begin="0.8s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <text x="390" y="147" class="value">ETL/ELT</text>

  <!-- AWS -->
  <text x="24" y="183" class="label">AWS / S3</text>
  <rect x="130" y="170" width="250" height="10" rx="5" fill="rgba(255,255,255,0.06)"/>
  <rect x="130" y="170" width="0" height="10" rx="5" fill="url(#barAws)">
    <animate attributeName="width" from="0" to="190" dur="1.2s" begin="1.0s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <text x="390" y="182" class="value">Cloud</text>

  <!-- ETL -->
  <text x="24" y="218" class="label">ETL / ELT</text>
  <rect x="130" y="205" width="250" height="10" rx="5" fill="rgba(255,255,255,0.06)"/>
  <rect x="130" y="205" width="0" height="10" rx="5" fill="url(#barEtl)">
    <animate attributeName="width" from="0" to="215" dur="1.2s" begin="1.2s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <text x="390" y="217" class="value">Core</text>

  <!-- Divider -->
  <line x1="24" y1="237" x2="476" y2="237" stroke="rgba(255,0,255,0.15)" stroke-width="1"/>

  <!-- Achievement chips -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.5s" fill="freeze"/>
    <!-- chip 1 -->
    <rect x="24"  y="248" width="135" height="46" rx="8" fill="rgba(255,0,255,0.08)" stroke="rgba(255,0,255,0.3)" stroke-width="1"/>
    <text x="91"  y="266" text-anchor="middle" style="font-family:'Poppins',sans-serif;font-size:14px;font-weight:700;fill:#ff00ff;">50M+</text>
    <text x="91"  y="282" text-anchor="middle" class="sublbl">Rows Processed</text>

    <!-- chip 2 -->
    <rect x="170" y="248" width="135" height="46" rx="8" fill="rgba(0,200,255,0.08)" stroke="rgba(0,200,255,0.3)" stroke-width="1"/>
    <text x="237" y="266" text-anchor="middle" style="font-family:'Poppins',sans-serif;font-size:14px;font-weight:700;fill:#00ffff;">40%</text>
    <text x="237" y="282" text-anchor="middle" class="sublbl">Perf. Improvement</text>

    <!-- chip 3 -->
    <rect x="316" y="248" width="160" height="46" rx="8" fill="rgba(255,150,0,0.08)" stroke="rgba(255,150,0,0.3)" stroke-width="1"/>
    <text x="396" y="266" text-anchor="middle" style="font-family:'Poppins',sans-serif;font-size:13px;font-weight:700;fill:#ffaa00;">Nagarro</text>
    <text x="396" y="282" text-anchor="middle" class="sublbl">Data Engineer</text>
  </g>

  <!-- Footer -->
  <text x="24" y="312" class="sublbl">vishal-github-org • Data Engineering • Nagarro</text>
</svg>
